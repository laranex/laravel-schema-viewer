name: tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  # release.yml runs the suite before publishing a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [10.*, 11.*, 12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: ^9.2 # 9.0/9.1 break on prefer-lowest (undeclared $latestResponse)
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 10.*
            php: 8.4
          - laravel: 10.*
            php: 8.5
          - laravel: 11.*
            php: 8.1
          - laravel: 11.*
            php: 8.5
          - laravel: 12.*
            php: 8.1
          - laravel: 13.*
            php: 8.1
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Shared viewer assets
        # The committed assets must be exactly the locked npm tarball's. ui:fetch also caches the verified tarball,
        # which the contract tests read their fixtures from.
        shell: bash
        run: |
          composer ui:fetch
          git diff --exit-code -- resources ui.stamp.json
          composer ui:check

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        if: runner.os != 'Windows'
        # One analysis process at a time: the type coverage plugin's forks share one cache file, and a fork that waits
        # too long for its lock reads it half written (a ParseError in .temp/v3.php).
        env:
          FORK_MEM_PER_PROC: 1099511627776000
        run: composer test:types

      - name: Test Suite
        if: runner.os != 'Windows'
        env:
          SCHEMA_VIEWER_CONTRACT: required
        run: composer test:unit

      - name: Test Suite (Windows)
        if: runner.os == 'Windows'
        env:
          SCHEMA_VIEWER_CONTRACT: required
        run: vendor/bin/pest

  assets:
    # Release gate: the git archive Composer installs carries the verified viewer assets, matching ui.lock.json, the
    # registry tarball and ui.stamp.json, and none of the development files. The repository and that archive hold no
    # schema snapshot: php artisan schema-viewer:scan fails the job on any non-zero exit (1 confirmed, 2 incomplete or
    # failed, 3 uncertain), and the archive must hold no document at all, allowed or not.
    runs-on: ubuntu-latest

    name: Viewer assets

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Check the assets against the lock, the registry and the git archive
        run: php scripts/ui.php check --registry --archive

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Scan the repository for schema snapshots
        run: |
          mkdir -p build/scan
          php vendor/bin/testbench schema-viewer:scan --tracked --untracked --report build/scan/tree.json

      - name: Scan the git archive Composer installs
        run: |
          mkdir -p build/scan build/archive
          git archive --format=tar HEAD | tar -x -C build/archive
          php vendor/bin/testbench schema-viewer:scan --artifacts build/archive --report build/scan/archive.json
          jq -e '.counts.allowed == 0' build/scan/archive.json

      - name: Upload the scan reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-scan-reports
          path: build/scan
          if-no-files-found: ignore
          retention-days: 7

  viewer:
    # The shared viewer as the package serves it: the workbench app, a real build, and headless Chrome under the page's
    # own Content-Security-Policy (scripts/browser-smoke.mjs, no Node.js dependencies).
    runs-on: ubuntu-latest

    name: Viewer in a browser

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Build the workbench and its schema snapshot
        run: |
          composer build
          php vendor/bin/testbench schema-viewer:build

      - name: Open the viewer in Chrome
        run: |
          php vendor/bin/testbench serve --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8000/schema-viewer && break; sleep 1; done
          VIEWER_URL=http://127.0.0.1:8000/schema-viewer CHROME_BIN=google-chrome node scripts/browser-smoke.mjs

  databases:
    # The inspector reads each database's own catalog, so the suite also runs on every database Laravel supports.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.4
            port: 3306
            health: --health-cmd="mysqladmin ping -h 127.0.0.1 -pSchema-Viewer-1" --health-interval=5s --health-timeout=5s --health-retries=20
          - db: mariadb
            image: mariadb:11.4
            port: 3306
            health: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
          - db: pgsql
            image: postgres:17
            port: 5432
            health: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
          - db: sqlsrv
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            health: --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Schema-Viewer-1 -Q 'SELECT 1'" --health-interval=10s --health-timeout=10s --health-retries=20

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: Schema-Viewer-1
          MYSQL_DATABASE: testing
          MARIADB_ROOT_PASSWORD: Schema-Viewer-1
          MARIADB_DATABASE: testing
          POSTGRES_PASSWORD: Schema-Viewer-1
          POSTGRES_DB: testing
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Schema-Viewer-1
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.health }}

    name: Database - ${{ matrix.db }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, sqlsrv, pdo_sqlsrv
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install the SQL Server ODBC driver
        if: matrix.db == 'sqlsrv'
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q msodbcsql18

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Test Suite
        env:
          SCHEMA_VIEWER_DB: ${{ matrix.db }}
          SCHEMA_VIEWER_DB_PORT: ${{ matrix.port }}
        # One process: the tests share the database.
        run: vendor/bin/pest
